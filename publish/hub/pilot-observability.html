<script>
(function(){
  /* po63: si una herramienta acaba dentro de un iframe (clon del marketing),
     toda la navegación de la barra toma la ventana superior — adiós bucles */
  document.querySelectorAll('#ns-hub-navbar a').forEach(function(a){a.target='_top';});
  /* po68: fuera la cabecera heredada "NUTRISYNC 🪶 · Member — open the app"
     (gated, consola MIS y Pitch la traían de serie; llevaba al marketing) */
  function hideLegacyHeader(){var ep=document.querySelector('.header-eps');if(ep){var hd=ep.closest('header');(hd||ep).style.display='none';}}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hideLegacyHeader);else hideLegacyHeader();
  /* po82: la pestaña ACTIVA se queda marcada. Antes se pintaba una sola vez y el
     re-render del motor (o el relayout) devolvía el color antiguo: mirando las
     pestañas no sabías dónde estabas. Ahora el marcado es (1) por atributo y por
     ESTILO EN LÍNEA — inmune a que el motor reescriba la hoja de estilos —,
     (2) se recalcula en continuo con MutationObserver, y (3) salta al instante
     al hacer clic, sin esperar a que cargue la página siguiente. */
  var here=(location.pathname.split('/').pop()||'').toLowerCase();
  var dir=location.pathname.toLowerCase();
  var ON='background:#FFFDFA;color:#E8472A;font-weight:700;border-color:#E6E0D8;box-shadow:inset 0 3px 0 #FD400C';
  function isHere(a){
    var f=(a.getAttribute('href')||'').toLowerCase();
    return (f.indexOf('/documentation/')>-1) ? dir.indexOf('/documentation/')>-1 : f.split('/').pop()===here;
  }
  function paint(a,on){
    a.classList.toggle('on',!!on);
    if(on){a.setAttribute('aria-current','page');a.setAttribute('style',ON);}
    else{a.removeAttribute('aria-current');a.removeAttribute('style');}
  }
  function markActive(el){
    var tabs=document.querySelectorAll('#nsnb-tabs .nsnb-tab');
    for(var i=0;i<tabs.length;i++)paint(tabs[i],el?tabs[i]===el:isHere(tabs[i]));
  }
  markActive();
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('#nsnb-tabs .nsnb-tab'):null;
    if(a)markActive(a);                       // feedback inmediato al navegar
  },true);
  var nb=document.getElementById('ns-hub-navbar');
  if(nb&&window.MutationObserver){
    var mo=new MutationObserver(function(){
      var cur=nb.querySelector('.nsnb-tab[aria-current]');
      if(!cur||!cur.getAttribute('style'))markActive();   // el motor lo borró → repintar
    });
    mo.observe(nb,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style']});
  }
  var n=0,rp=setInterval(function(){markActive();if(++n>6)clearInterval(rp);},400);
  var d=new Date();
  var el=document.getElementById('nsnb-date');
  if(el)el.textContent=d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  /* po66: una fila si cabe; si no, corte en el limite y 2o escalon ladrillo */
  function relayout(){
    var r1=document.getElementById('nsnb-r1'),r2=document.getElementById('nsnb-r2');
    if(!r1||!r2)return;
    var tabs=Array.prototype.slice.call(document.querySelectorAll('#nsnb-tabs .nsnb-tab'));
    tabs.forEach(function(t){r1.appendChild(t);});
    r2.style.display='none';
    if(r1.scrollWidth<=r1.clientWidth+1){pad();return;}
    var w=r1.clientWidth,acc=0,brk=tabs.length;
    for(var i=0;i<tabs.length;i++){acc+=tabs[i].offsetWidth+4;if(acc>w){brk=i;break;}}
    if(brk<1)brk=1;
    r2.style.display='flex';
    tabs.slice(brk).forEach(function(t){r2.appendChild(t);});
    pad();markActive();          // po82: mover pestañas no puede borrar la marca
  }
  function pad(){var h=document.getElementById('ns-hub-navbar').offsetHeight||96;document.body.style.paddingTop=(h+6)+'px';}
  var rT;window.addEventListener('resize',function(){clearTimeout(rT);rT=setTimeout(relayout,150);});
  relayout();
})();
</script>

async function loadHealth(){

  if(!data)return;
  const jobs=data.jobs||[],snap=data.snapshot;

    '<span class="hint">'+esc(j.schedule)+' · '+when(j.start_time)+(why(j)?' · '+why(j):'')+'</span></div>').join('');
  const snapTxt=snap?('<div class="hint" style="margin-top:8px">'+T.snapLbl+': '+when(snap.taken_at)+' · '+

}

    const pw=await sb.rpc('admin_pilot_weekly',{p_cohort:c});
    if(pw.error){nsFail(pw.error,'admin_pilot_weekly');$('states').innerHTML='<div class="warn">'+T.noSql+'</div>';return;}
    const W=(pw.data||{}).weeks||[],S=+(pw.data||{}).scale||58,COH=(pw.data||{}).cohorts||[];
    if($('coh').options.length<=1){
      $('coh').innerHTML='<option value="">'+T.cohAll+'</option>'+COH.map(x=>'<option value="'+esc(x.cohort)+'">'+esc(x.cohort)+' ('+x.total+')</option>').join('');
      $('coh').onchange=loadWeekly;
    }
    $('cohCards').innerHTML=P.cohortCards(COH,{lInv:T.lInv,lAsg:T.lAsg,lIns:T.lIns,lAct:T.lAct});
    const cur=W.filter(w=>w.is_past).pop()||{};
    $('kpis').innerHTML=
      P.kpi(T.kInv,(+cur.invited||0),T.kInvS)+
      P.kpi(T.kAsg,(+cur.assigned||0),T.kAsgS)+
      P.kpi(T.kIns,(+cur.installed||0),'iOS '+(+cur.ios||0)+' · Android '+(+cur.android||0))+
      P.kpi(T.kPend,(+cur.pending||0),T.kPendS)+
      P.kpi(T.kAct,(+cur.active||0),(+cur.installed?Math.round((+cur.active||0)/(+cur.installed)*100)+'% ':'')+T.kActS);
    $('states').innerHTML=W.length?P.statesChart(W,S):'<div class="warn">'+T.noRows+'</div>';
    $('statesLegend').innerHTML=W.length?P.legend([[T.lInv,P.C.muted],[T.lAsg,P.C.coral2],[T.lIns,P.C.coral],[T.lPend,P.C.plan,1]]):'';
    $('active').innerHTML=W.length?P.activeChart(W,S):'';
    $('activeLegend').innerHTML=W.length?P.legend([[T.lPlan,P.C.plan,1],[T.lAct,P.C.coral]]):'';
  }
  $('coh').innerHTML='<option value="">'+T.cohAll+'</option>';
  await loadWeekly();
  await loadHealth();

  const [fn,kp]=await Promise.all([sb.rpc('admin_pilot_funnel'),sb.rpc('admin_kpis')]);
  const daily=((kp.data||{}).daily_active)||[];
  const maxD=Math.max.apply(null,daily.concat([1]));
  $('daily').innerHTML=daily.length?daily.map(v=>
    '<div class="bar"><span class="hint">'+v+'</span><i style="height:'+Math.max(2,(v/maxD)*88)+'px"></i></div>').join(''):
    '<div class="hint">'+T.noRows+'</div>';

  const by=((fn.data||{}).by_cohort)||[];
  $('funnel').innerHTML=by.length?by.map(c=>
    '<div style="margin-bottom:12px"><b>'+esc(c.cohort)+'</b><div class="fn">'+
    [[c.total,T.lInv],[c.confirmed,T.lAsg],[c.joined,T.lIns],[c.active7,T.lAct],[c.pending_install,T.kPend]]
      .map(x=>'<div><b>'+(x[0]??0)+'</b><span>'+x[1]+'</span></div>').join('')+
    '</div></div>').join(''):'<div class="hint">'+T.noRows+'</div>';

  const fb=await sb.rpc('admin_pilot_feedback',{p_cohort:null});
  $('fb').tBodies[0].innerHTML=((fb.data||[]).map(r=>
    '<tr><td>'+esc((r.created_at||'').slice(0,16).replace('T',' '))+'</td><td>'+esc(r.cohort||'')+'</td><td>'+esc(r.email||'')+'</td>'+
    '<td class="msg">'+esc(r.message||'')+'</td><td>'+esc(r.app_version||'?')+' · '+esc(r.platform||'?')+'</td></tr>').join(''))
    ||'<tr><td colspan="5" class="hint">'+T.noFb+'</td></tr>';
})();
</script>
</body></html>
