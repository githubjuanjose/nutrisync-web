<h1 data-i="📈 Propuesta 36 — Analítica y visibilidad: dos raíles y una decisión|📈 Proposal 36 — Analytics & visibility: two rails and one decision"></h1>
<div class="meta">6-ago-2026 · r14f · <span data-i="decisión D20 en la pestaña Decisions|decision D20 in the Decisions tab"></span></div>

<p data-i="Queremos tráfico, descargas, ubicaciones y accesos en un dashboard sencillo para founders. La pregunta no es «¿Firebase sí o no?» sino «¿qué necesitamos que no tengamos ya?». Respuesta corta: el 80% ya es nuestro — solo hay que enchufarlo.|We want traffic, downloads, locations and access in one simple founders dashboard. The question is not “Firebase yes or no” but “what do we need that we don't already have?”. Short answer: 80% is already ours — it just needs plugging in."></p>

<h2 data-i="Rail A — sin vendors nuevos (se activa YA)|Rail A — no new vendors (activates NOW)"></h2>
<table>
<tr><th data-i="Qué|What"></th><th data-i="De dónde sale|Source"></th><th data-i="Estado|Status"></th></tr>
<tr><td data-i="Tráfico web (las 3 webs): visitas, páginas, únicos, países|Web traffic (all 3 sites): visits, pages, uniques, countries"></td><td>Cloudflare GraphQL API</td><td data-i="Edge <code>web-stats</code> lista + cron 07:45 — solo falta el token (2 min)|Edge <code>web-stats</code> ready + 07:45 cron — only the token missing (2 min)"></td></tr>
<tr><td data-i="Descargas/instalaciones iOS|iOS installs"></td><td>App Store Connect API</td><td class="ok" data-i="YA corre (store-stats 06:30)|Already running (store-stats 06:30)"></td></tr>
<tr><td data-i="Instalaciones Android + activas diarias|Android installs + daily actives"></td><td data-i="Señales propias (auth + access_log)|Our own signals (auth + access_log)"></td><td class="ok" data-i="YA corren|Already running"></td></tr>
<tr><td data-i="Ubicaciones de usuarias de la app|App user locations"></td><td data-i="Ciudad del onboarding (permiso explícito, agregada sin PII)|Onboarding city (explicit consent, aggregated, no PII)"></td><td class="ok" data-i="YA se captura|Already captured"></td></tr>
<tr><td data-i="Dashboard founders 📈 Panorama|Founders dashboard 📈 Panorama"></td><td data-i="Página nueva del hub, bilingüe|New hub page, bilingual"></td><td data-i="r15 (mañana) — bebe de todo lo anterior|r15 (tomorrow) — feeds on all of the above"></td></tr>
</table>

<h2 data-i="Rail B — Firebase: qué añade DE VERDAD y qué cuesta|Rail B — Firebase: what it TRULY adds and what it costs"></h2>
<table>
<tr><th data-i="Añade|Adds"></th><th data-i="Cuesta|Costs"></th></tr>
<tr><td data-i="Crashlytics: stack traces de cierres inesperados (esto NO lo tenemos y es oro en piloto grande)|Crashlytics: crash stack traces (we do NOT have this; gold in a large pilot)"></td>
<td data-i="SDK nativo → build nuevo en las DOS stores · datos a servidores de Google (EEUU)|Native SDK → new build on BOTH stores · data to Google servers (US)"></td></tr>
<tr><td data-i="Analytics: retención por cohortes y funnels automáticos|Analytics: retention cohorts and automatic funnels"></td>
<td data-i="App de SALUD: DPA con Google + consentimiento in-app + REDECLARAR privacy labels en App Store y data safety en Play (reabre revisiones) + dictamen del abogado (transferencias EEUU)|HEALTH app: Google DPA + in-app consent + REDECLARING App Store privacy labels and Play data safety (reopens reviews) + lawyer sign-off (US transfers)"></td></tr>
</table>
<div class="box" data-i="<b>Decisión (marco de Juanjo, 6-ago):</b> DOS opciones separadas. <b>Opción 2 — Cloudflare + monitorización propia: YA VIVA</b> (primera instantánea 5-ago: 2.734 peticiones · 134 únicos) y alimenta la sección 📡 de Observabilidad. <b>Opción 1 — Firebase: al roadmap de aquí al 8-oct</b> con candado innegociable: <b>CERO información de usuaria — sin userId, sin propiedades de usuario, sin PII, nada de nada</b>; solo eventos anónimos de dispositivo (patrón ya aplicado por Juanjo en banca móvil, empezando por Crashlytics sin Analytics). Aun en modo cero-PII, el SDK envía identificadores de dispositivo e IP a Google (EEUU) → dictamen del abogado + redeclarar labels en las dos stores antes de encender.|<b>Decision (Juanjo&#39;s framing, Aug 6):</b> TWO separate options. <b>Option 2 — Cloudflare + own monitoring: ALREADY LIVE</b> (first snapshot Aug 5: 2,734 requests · 134 uniques) feeding the 📡 section in Observability. <b>Option 1 — Firebase: on the roadmap before Oct 8</b> with a non-negotiable lock: <b>ZERO user information — no userId, no user properties, no PII, nothing at all</b>; anonymous device events only (a pattern Juanjo has shipped in mobile banking, starting with Crashlytics without Analytics). Even in zero-PII mode the SDK sends device identifiers and IP to Google (US) → lawyer sign-off + relabeling in both stores before switching on."></div>

<li data-i="SQL de la sesión (tabla + RPC + cron + decisión D20) — inline en el chat, como siempre.|Session SQL (table + RPC + cron + D20 decision) — inline in chat, as always."></li>
