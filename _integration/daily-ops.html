<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Operations &amp; SOP — NutriSync Founders</title>
<style>
:root{--coral:#E8472A;--ink:#231F20;--muted:#8A7F78;--line:#EFE3D7;--bg:#FFFDF8;--good:#0F9B57;--bad:#C73A20;--warn:#B4700F;}
*{box-sizing:border-box}body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
.wrap{max-width:1150px;margin:0 auto;padding:26px 20px 80px;}
h1{font-size:24px;margin:0 0 2px}h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.back{font-size:13px;color:var(--muted);text-decoration:none}
#gate{display:none;padding:60px 20px;text-align:center;color:var(--muted)}
.todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:none}
.todo .n{font-size:24px;font-weight:800;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.todo .t{flex:1}
.todo .t b{display:block;font-size:13.5px}
.todo .t span{font-size:11.5px;color:var(--muted)}
.todo a{font-size:12px;font-weight:700;color:var(--coral);text-decoration:none;white-space:nowrap;border:1px solid #F3C8B8;border-radius:20px;padding:5px 12px}
.todo a:hover{background:#FFF1EC}
.quiet .n{color:var(--muted)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;background:#fff}
details summary{cursor:pointer;font-weight:700;font-size:13.5px}
details ol,details ul{margin:8px 0 4px;padding-left:20px;font-size:12.5px;line-height:1.7}
code{background:#F6EEE7;border-radius:5px;padding:1px 5px;font-size:11.5px}
.ms{background:#FFF8EF;border:1px solid #F0DCC4;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:10px}
</style></head><body>
<div class="wrap" id="app" style="display:none">
  <a class="back" href="full-hub-gated-site.html">‹ Hub</a>
  <h1>📋 <span data-t="title"></span></h1>
  <div class="sub" data-t="sub"></div>

  <div id="health"></div>

  <h2>1 · <span data-t="h1"></span></h2>
  <div class="card" id="todos"><div class="hint" data-t="loading"></div></div>
  <div class="ms" id="dates"></div>

  <h2>2 · <span data-t="h2"></span></h2>
  <div id="sop"></div>
</div>
<div id="gate" data-t="gate"></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const U='https://nebkqncvapelrarruyqb.supabase.co',K='sb_publishable_GYj7DKlcWZ2cxdwv-GkyHQ_WBbQWHau';
const sb=createClient(U,K);const $=i=>document.getElementById(i);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ES=(navigator.language||'en').toLowerCase().indexOf('es')===0;
const T=ES?{
  title:'Operación diaria y SOP', gate:'Inicia sesión de founder (Access + admin con MFA) y recarga.',
  sub:'Lo que hay que mirar hoy y cómo se hace cada cosa. Se calcula solo al abrir: no hay nada que ejecutar a mano.',
  h1:'Hoy toca', h2:'Procedimientos (SOP)', loading:'Calculando…',
  autoOk:'Automatismos al día', autoBad:'⚠️ Un automatismo ha fallado',
  autoSub:'Se comprueba solo cada vez que abres esta página',
  jNever:'sin ejecutar todavía', jStale:'sin correr en más de 26 h', jFail:'último intento fallido',
  snapLbl:'Última foto de TestFlight',
  tStore:'Sin correo de tienda', tStoreS:'invitadas hace 3+ días que no han respondido — el recordatorio sale solo a las 9:00',
  tInst:'Con build, sin instalar', tInstS:'tienen la app asignada y no han entrado',
  tFb:'Feedback sin revisar', tFbS:'mensajes de testers en los últimos 7 días',
  tAct:'Activas esta semana', tActS:'de las instaladas — es la métrica que decide si el piloto funciona',
  go:'Ir', allClear:'Nada pendiente hoy 🎉',
  dates:'<b>Fechas que mandan</b> · <b>17-ago</b>: 12 testers Android activas 14 días seguidos (Google Play). · <b>8-oct</b>: lanzamiento.',
  d17:'días para el hito de Google Play', d8:'días para el lanzamiento', past:'PASADO',
  sop:[
    ['Desplegar web',['Deja el zip en <code>inbox/</code>.','Ejecuta <b>Deploy NutriSync Web.command</b>: pasa semáforo, unitarios y grafo de enlaces, y aborta solo si algo está rojo.','Espera ~90 s al build de Cloudflare y recarga con Cmd+Shift+R.','El smoke corre solo al final: si sale algún ✗, míralo antes de seguir.']],
    ['Publicar cambio de app (OTA)',['<code>npm test</code> primero — la regla es que ninguna lógica sale sin sus unitarios.','Doble OTA mientras convivan los runtimes 0.18.0 y 0.19.0.','Las testers reciben el cambio al cerrar la app <b>dos veces</b>.','Si el cambio toca dependencias nativas o permisos, no vale OTA: hay que hacer build.']],
    ['Si un automatismo sale en rojo',['Mira arriba qué cron es y qué dijo el último intento.','<code>store-stats</code> en rojo: casi siempre la clave de Apple caducada o revocada.','<code>pilot-reminders</code> en rojo: revisa el buzón SMTP de IONOS.','<code>ticket-escalation</code> (cada hora): escala a founders las incidencias con +24 h — si sale en rojo, revisa el SMTP; nada se pierde, reintenta a la hora siguiente.','Nada se pierde: al día siguiente vuelve a intentarlo solo.']],
    ['Alta de testers nuevas',['Proponer el lote desde la waitlist en <b>Piloto</b>.','Las founders aprueban y mandan el correo de captura.','Cuando confirmen su correo de tienda: CSV a TestFlight o alta en Play.','Marcar como invitadas. El resto (instaló, entró, usa) se detecta solo.']],
    ['Volver atrás un deploy',['El zip anterior vive en <code>releases/</code> y es inmutable.','Se restaura sobre <code>publish/</code>, se re-integra y se vuelve a desplegar.','Dos minutos. Ante la duda, revertir primero y depurar después.']],
  ]
}:{
  title:'Daily Operations & SOP', gate:'Sign in as a founder (Access + admin with MFA) and reload.',
  sub:'What to look at today and how each thing is done. Computed on open: nothing to run by hand.',
  h1:'Today', h2:'Procedures (SOP)', loading:'Computing…',
  autoOk:'Automations healthy', autoBad:'⚠️ An automation failed',
  autoSub:'Checked automatically every time you open this page',
  jNever:'never run yet', jStale:'no run in over 26 h', jFail:'last attempt failed',
  snapLbl:'Latest TestFlight snapshot',
  tStore:'No store email', tStoreS:'invited 3+ days ago, no reply — the reminder goes out on its own at 9:00',
  tInst:'Assigned, not installed', tInstS:'they have the build and have not come in',
  tFb:'Unreviewed feedback', tFbS:'tester messages in the last 7 days',
  tAct:'Active this week', tActS:'of everyone installed — the metric that decides if the pilot works',
  go:'Open', allClear:'Nothing pending today 🎉',
  dates:'<b>Dates that rule</b> · <b>17 Aug</b>: 12 Android testers active 14 days straight (Google Play). · <b>8 Oct</b>: launch.',
  d17:'days to the Google Play milestone', d8:'days to launch', past:'PASSED',
  sop:[
    ['Deploy web',['Drop the zip in <code>inbox/</code>.','Run <b>Deploy NutriSync Web.command</b>: it runs the guardrail, unit tests and link graph, and aborts on red.','Wait ~90 s for the Cloudflare build and hard-refresh.','The smoke test runs at the end: if any ✗ shows up, look at it before moving on.']],
    ['Ship an app change (OTA)',['<code>npm test</code> first — no logic ships without its unit tests.','Double OTA while runtimes 0.18.0 and 0.19.0 coexist.','Testers get it after closing the app <b>twice</b>.','Native deps or permissions? OTA is not enough: needs a build.']],
    ['If an automation goes red',['Check above which cron it is and what the last attempt said.','<code>store-stats</code> red: almost always the Apple key expired or was revoked.','<code>pilot-reminders</code> red: check the IONOS SMTP mailbox.','<code>ticket-escalation</code> (hourly): escalates 24h+ incidents to founders — if red, check SMTP; nothing is lost, it retries next hour.','Nothing is lost: it retries by itself the next day.']],
    ['Onboarding new testers',['Propose the batch from the waitlist in <b>Pilot</b>.','Founders approve and send the capture email.','Once they confirm their store email: CSV to TestFlight or add to Play.','Mark as invited. The rest (installed, joined, active) is detected automatically.']],
    ['Roll back a deploy',['The previous zip lives in <code>releases/</code> and is immutable.','Restore it over <code>publish/</code>, re-integrate and deploy again.','Two minutes. When in doubt, revert first and debug after.']],
  ]
};
document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=T[el.dataset.t]||'';});
document.title=T.title+' — NutriSync Founders';


/* r12-b9 (fallo de hoy): si una RPC no existe, la pagina se quedaba en blanco y
   parecia que "no hay datos". Ahora GRITA, y dice el fichero que falta correr. */
function nsFail(err,fn){
  var d=document.getElementById('nsfail');
  if(!d){d=document.createElement('div');d.id='nsfail';
    d.style.cssText='background:#FFF1EC;border:2px solid #E8472A;border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:13px;color:#8A2A18';
    var w=document.querySelector('.wrap');w.insertBefore(d,w.children[2]||null);}
  d.innerHTML='<b>⚠️ Falta aplicar SQL en Supabase</b><div style="margin-top:6px">La consulta <code>'+fn+
    '</code> no responde: <i>'+String((err&&err.message)||err).slice(0,160)+'</i></div>'+
    '<div style="margin-top:6px">Ejecuta <b>backend-sql/2026-08-04-EJECUTAR-TODO-PENDIENTE.sql</b> entero y recarga.</div>';
}

const when=t=>t?new Date(t).toLocaleString(ES?'es-ES':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const days=iso=>Math.ceil((new Date(iso)-new Date())/86400000);

async function loadHealth(){
  const{data,error}=await sb.rpc('admin_automation_health');
  if(error){nsFail(error,'admin_automation_health');return;}
  if(!data)return;
  const jobs=data.jobs||[],snap=data.snapshot;
  const bad=jobs.filter(j=>!j.active||!j.ok||!j.fresh);
  const why=j=>!j.start_time?T.jNever:(!j.ok?T.jFail:(!j.fresh?T.jStale:''));
  const rows=jobs.map(j=>'<div style="display:flex;gap:8px;align-items:baseline;font-size:12.5px;margin-top:3px">'+
    '<span>'+((j.active&&j.ok&&j.fresh)?'🟢':'🔴')+'</span><b>'+esc(j.jobname)+'</b>'+
    '<span class="hint">'+esc(j.schedule)+' · '+when(j.start_time)+(why(j)?' · '+why(j):'')+'</span></div>').join('');
  const snapTxt=snap?('<div class="hint" style="margin-top:8px">'+T.snapLbl+': '+when(snap.taken_at)+' · '+
    (snap.total||0)+' testers · '+esc(JSON.stringify(snap.tally||{}))+'</div>'):'';
  $('health').innerHTML='<div class="card" style="margin-top:0;border-color:'+(bad.length?'#E8B072':'var(--line)')+
    ';background:'+(bad.length?'#FFF8EF':'#fff')+'">'+
    '<b style="font-size:13px;color:'+(bad.length?'var(--bad)':'var(--good)')+'">'+(bad.length?T.autoBad:'🟢 '+T.autoOk)+'</b>'+
    '<div class="hint">'+T.autoSub+'</div>'+rows+snapTxt+'</div>';
}

async function loadTodos(){
  const [due,pw,fb]=await Promise.all([
    sb.rpc('admin_pilot_reminders_due'),
    sb.rpc('admin_pilot_weekly',{p_cohort:null}),
    sb.rpc('admin_pilot_feedback',{p_cohort:null}),
  ]);
  if(due.error)nsFail(due.error,'admin_pilot_reminders_due');
  if(pw.error)nsFail(pw.error,'admin_pilot_weekly');
  const d=due.data||{}, weeks=((pw.data||{}).weeks)||[];
  const cur=weeks.filter(w=>w.is_past).pop()||{};
  const since=Date.now()-7*86400000;
  const fbN=((fb.data||[]).filter(r=>new Date(r.created_at).getTime()>since)).length;
  const items=[
    [d.store||0, T.tStore, T.tStoreS, '/hub/pilot.html'],
    [d.install||0, T.tInst, T.tInstS, '/hub/pilot.html'],
    [fbN, T.tFb, T.tFbS, '/hub/pilot-observability.html'],
    [cur.active||0, T.tAct, T.tActS, '/hub/pilot-observability.html'],
  ];
  $('todos').innerHTML=items.map(([n,t,s,href])=>
    '<div class="todo'+(n?'':' quiet')+'"><div class="n" style="color:'+(n?'var(--coral)':'')+'">'+n+'</div>'+
    '<div class="t"><b>'+t+'</b><span>'+s+'</span></div>'+
    '<a href="'+href+'" target="_top">'+T.go+' ›</a></div>').join('');
  const a=days('2026-08-17'), b=days('2026-10-08');
  $('dates').innerHTML=T.dates+'<div style="margin-top:6px"><b>'+(a>0?a:T.past)+'</b> '+T.d17+
    ' · <b>'+(b>0?b:T.past)+'</b> '+T.d8+'</div>';
}

$('sop').innerHTML=T.sop.map(([h,steps])=>
  '<details><summary>'+h+'</summary><ol>'+steps.map(s=>'<li>'+s+'</li>').join('')+'</ol></details>').join('');

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(!session){$('gate').style.display='block';return;}
  $('app').style.display='block';
  await Promise.all([loadHealth(),loadTodos()]);
})();
</script>
</body></html>
