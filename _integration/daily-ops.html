    d.style.cssText='background:#FFF1EC;border:2px solid #E8472A;border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:13px;color:#8A2A18';

  d.innerHTML='<b>⚠️ Falta aplicar SQL en Supabase</b><div style="margin-top:6px">La consulta <code>'+fn+
    '</code> no responde: <i>'+String((err&&err.message)||err).slice(0,160)+'</i></div>'+
    '<div style="margin-top:6px">Ejecuta <b>backend-sql/2026-08-04-EJECUTAR-TODO-PENDIENTE.sql</b> entero y recarga.</div>';
}

const when=t=>t?new Date(t).toLocaleString(ES?'es-ES':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const days=iso=>Math.ceil((new Date(iso)-new Date())/86400000);

async function loadHealth(){
  const{data,error}=await sb.rpc('admin_automation_health');
  if(error){nsFail(error,'admin_automation_health');return;}
  if(!data)return;
  const jobs=data.jobs||[],snap=data.snapshot;
  const bad=jobs.filter(j=>!j.active||!j.ok||!j.fresh);
  const why=j=>!j.start_time?T.jNever:(!j.ok?T.jFail:(!j.fresh?T.jStale:''));
  const rows=jobs.map(j=>'<div style="display:flex;gap:8px;align-items:baseline;font-size:12.5px;margin-top:3px">'+
    '<span>'+((j.active&&j.ok&&j.fresh)?'🟢':'🔴')+'</span><b>'+esc(j.jobname)+'</b>'+
    '<span class="hint">'+esc(j.schedule)+' · '+when(j.start_time)+(why(j)?' · '+why(j):'')+'</span></div>').join('');
  const snapTxt=snap?('<div class="hint" style="margin-top:8px">'+T.snapLbl+': '+when(snap.taken_at)+' · '+
    (snap.total||0)+' testers · '+esc(JSON.stringify(snap.tally||{}))+'</div>'):'';
  $('health').innerHTML='<div class="card" style="margin-top:0;border-color:'+(bad.length?'#E8B072':'var(--line)')+
    ';background:'+(bad.length?'#FFF8EF':'#fff')+'">'+
    '<b style="font-size:13px;color:'+(bad.length?'var(--bad)':'var(--good)')+'">'+(bad.length?T.autoBad:'🟢 '+T.autoOk)+'</b>'+
    '<div class="hint">'+T.autoSub+'</div>'+rows+snapTxt+'</div>';
}

async function loadTodos(){
  const [due,pw,fb]=await Promise.all([
    sb.rpc('admin_pilot_reminders_due'),
    sb.rpc('admin_pilot_weekly',{p_cohort:null}),
    sb.rpc('admin_pilot_feedback',{p_cohort:null}),
  ]);
  if(due.error)nsFail(due.error,'admin_pilot_reminders_due');
  if(pw.error)nsFail(pw.error,'admin_pilot_weekly');
  const d=due.data||{}, weeks=((pw.data||{}).weeks)||[];
  const cur=weeks.filter(w=>w.is_past).pop()||{};
  const since=Date.now()-7*86400000;
  const fbN=((fb.data||[]).filter(r=>new Date(r.created_at).getTime()>since)).length;
  const items=[
    [d.store||0, T.tStore, T.tStoreS, '/hub/pilot.html'],
    [d.install||0, T.tInst, T.tInstS, '/hub/pilot.html'],
    [fbN, T.tFb, T.tFbS, '/hub/pilot-observability.html'],
    [cur.active||0, T.tAct, T.tActS, '/hub/pilot-observability.html'],
  ];
  $('todos').innerHTML=items.map(([n,t,s,href])=>
    '<div class="todo'+(n?'':' quiet')+'"><div class="n" style="color:'+(n?'var(--coral)':'')+'">'+n+'</div>'+
    '<div class="t"><b>'+t+'</b><span>'+s+'</span></div>'+
    '<a href="'+href+'" target="_top">'+T.go+' ›</a></div>').join('');
  const a=days('2026-08-17'), b=days('2026-10-08');
  $('dates').innerHTML=T.dates+'<div style="margin-top:6px"><b>'+(a>0?a:T.past)+'</b> '+T.d17+
    ' · <b>'+(b>0?b:T.past)+'</b> '+T.d8+'</div>';
}

$('sop').innerHTML=T.sop.map(([h,steps])=>
  '<details><summary>'+h+'</summary><ol>'+steps.map(s=>'<li>'+s+'</li>').join('')+'</ol></details>').join('')
 +'<details><summary>⏰ founder-reminders · 07:15 UTC</summary><ol>'
 +'<li>Digest diario a founders + contact@ + review@ SOLO si hay pendientes (🗳 decisiones · 🔔 notificaciones · 🎫 incidencias · 🔐 MFA).</li>'
 +'<li>Si el tablero está limpio no envía nada — el silencio es la señal buena. / Daily digest, only sent while something is pending; a clean board sends nothing.</li>'
 +'</ol></details>';

/* Sección 3 · Copias de seguridad (r17-g, 11-ago). Una tabla honesta: lo que
   está automatizado y lo que depende de que alguien se acuerde, con el peor
   caso de cada cosa. Los huecos se listan en vez de esconderse — un inventario
   que solo enseña lo que funciona no es un inventario. */
$('bk').innerHTML='<div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.3px">'
  +'<thead><tr>'+T.bkCols.map(c=>'<th style="text-align:left;padding:6px 8px;border-bottom:2px solid #EADFD0;'
    +'font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#8A7F78">'+c+'</th>').join('')+'</tr></thead><tbody>'
  +T.bk.map(f=>'<tr>'+f.map((c,i)=>'<td style="padding:6px 8px;border-bottom:1px solid #F4EADF;vertical-align:top'
    +(i===5&&c==='MANUAL'?';color:#B4700F;font-weight:800':'')
    +(i===5&&c!=='MANUAL'?';color:#0F6E56;font-weight:700':'')+'">'+c+'</td>').join('')+'</tr>').join('')
  +'</tbody></table></div>'
  +'<div class="ms" style="margin-top:10px">'+T.bkGaps+'</div>';

/* Estado EN VIVO: lo reporta el script de copias a `backup_runs`. Una página
   que dijera "las copias van bien" sin leer nada seria decoracion — repetiria
   lo que alguien escribio una vez, no lo que paso de verdad. */
sb.rpc('admin_backup_estado').then(r=>{
  const f=r.data||[];
  const horas=h=>h==null?'—':(h<1?'hace menos de 1 h':(h<48?'hace '+h+' h':'hace '+Math.round(h/24)+' d'));
  const mb=b=>b==null?'—':(b>1e9?(b/1e9).toFixed(2)+' GB':(b/1e6).toFixed(0)+' MB');
  $('bkVivo').innerHTML='<h3 style="font-size:13.5px;margin:14px 0 2px">'+T.vivoT+'</h3>'
    +'<div class="hint" style="margin-bottom:8px">'+T.vivoSub+'</div>'
    +(f.length?'<div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.3px"><tbody>'
      +f.map(x=>{
        const viejo = x.horas==null || x.horas>8;          // la tarea corre cada 4 h
        const col = !x.ultimo_ok ? '#C73A20' : (viejo?'#B4700F':'#0F6E56');
        return '<tr><td style="padding:6px 8px;border-bottom:1px solid #F4EADF;font-weight:700">'+esc(x.activo)+'</td>'
          +'<td style="padding:6px 8px;border-bottom:1px solid #F4EADF;color:'+col+';font-weight:700">'
          +(!x.ultimo_ok?'✗ falló':(viejo?'⚠ '+horas(x.horas):'✓ '+horas(x.horas)))+'</td>'
          +'<td style="padding:6px 8px;border-bottom:1px solid #F4EADF">'+mb(x.bytes)
          +(x.ficheros!=null?' · '+x.ficheros+' fich.':'')+'</td>'
          +'<td style="padding:6px 8px;border-bottom:1px solid #F4EADF;color:#8A7F78">'+esc(x.ultimo_detalle||'')
          +(x.fallos_7d>0?' · <b style="color:#C73A20">'+x.fallos_7d+' fallo(s) en 7 d</b>':'')+'</td></tr>';}).join('')
      +'</tbody></table></div>'
      :'<div class="ms">'+T.vivoNada+'</div>');
}).catch(()=>{ $('bkVivo').innerHTML='<div class="ms">'+T.vivoNada+'</div>'; });

/* Evidencia (decisión Juanjo, 11-ago): «todas a Supabase, nada en HTML; enlace
   con PIN». Una captura del panel servida como fichero estático es un objeto
   que existe en una CDN — la puerta la pone Access, pero el objeto está ahí.
   En Storage privado no hay URL pública: solo una firmada que caduca. */
window.nsEvVer=function(id){
  const pin=(document.getElementById('evPin')||{}).value||'';
  sb.rpc('admin_evidencia_ver',{p_id:id,p_pin:pin}).then(r=>{
    if(r.error||!r.data||!r.data.url){ document.getElementById('evMsg').textContent=T.evMal; return; }
    document.getElementById('evMsg').textContent='';
    window.open(r.data.url,'_blank','noopener');
  });
};
sb.rpc('admin_evidencia_list',{p_tema:'copias'}).then(r=>{
  const e=r.data||[];
  document.getElementById('bkEv').innerHTML=
    '<details><summary>'+T.evT+'</summary>'
    +'<div class="hint" style="margin:8px 0">'+T.evSub+'</div>'
    +(e.length?'<div style="display:flex;gap:8px;align-items:center;margin:10px 0">'
       +'<input id="evPin" type="password" inputmode="numeric" placeholder="'+T.evPin+'" '
       +'style="width:110px;padding:7px 10px;border:1px solid #EADFD0;border-radius:9px;font:inherit">'
       +'<span id="evMsg" class="hint" style="color:#C73A20"></span></div>'
       +'<ol style="font-size:12.5px;line-height:1.9">'
       +e.map(x=>'<li>'+esc(x.titulo)
          +' <button onclick="window.nsEvVer('+x.id+')" style="margin-left:6px">'+T.evVer+'</button>'
          +(x.nota?'<div class="hint">'+esc(x.nota)+'</div>':'')+'</li>').join('')
       +'</ol>'
     :'<div class="ms">'+T.evNada+'</div>')
    +'</details>';
}).catch(()=>{});

  $('cn').innerHTML=a.length?'<div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.2px">'

      +'font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#8A7F78">'+c+'</th>').join('')+'</tr></thead><tbody>'
    +a.map(x=>'<tr>'
      +'<td style="padding:7px 8px;border-bottom:1px solid #F4EADF;font-weight:700;color:'+(col[x.riesgo]||'#241D1A')+'">'
        +esc(x.sistema)+'<div class="hint" style="font-weight:400">'+esc(x.para_que)+'</div></td>'
      +'<td style="padding:7px 8px;border-bottom:1px solid #F4EADF">'+esc(x.titular)+'</td>'
      +'<td style="padding:7px 8px;border-bottom:1px solid #F4EADF">'+esc(x.quien_entra)+'</td>'
      +'<td style="padding:7px 8px;border-bottom:1px solid #F4EADF">'+esc(x.si_falta)+'</td></tr>').join('')
    +'</tbody></table></div>':'<div class="ms">—</div>';
}).catch(()=>{ $('cn').innerHTML='<div class="ms">—</div>'; });

$('cnSop').innerHTML=T.cnSop.map(([h,steps])=>
  '<details><summary>'+h+'</summary><ol>'+steps.map(x=>'<li>'+x+'</li>').join('')+'</ol></details>').join('');

$('bkSop').innerHTML=T.bkSop.map(([h,steps])=>
  '<details><summary>'+h+'</summary><ol>'+steps.map(x=>'<li>'+x+'</li>').join('')+'</ol></details>').join('')
 +'';

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(!session){$('gate').style.display='block';return;}
  $('app').style.display='block';
  await Promise.all([loadHealth(),loadTodos()]);
})();
