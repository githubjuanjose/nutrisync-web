<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilot Planning — NutriSync Founders</title>
<style>
:root{--coral:#E8472A;--ink:#231F20;--muted:#8A7F78;--line:#EFE3D7;--bg:#FFFDF8;--good:#0F9B57;--bad:#C73A20;}
*{box-sizing:border-box}body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
.wrap{max-width:1150px;margin:0 auto;padding:26px 20px 80px;}
h1{font-size:24px;margin:0 0 2px}h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font-family:inherit;font-weight:700;font-size:13px;border-radius:22px;padding:8px 16px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.mini{font-size:11px;padding:3px 9px;border-radius:9px}
input{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.now td{background:#FFF6EF}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:800;margin-top:3px}
.ms{background:#FFF8EF;border:1px solid #F0DCC4;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:10px}
#gate{display:none;padding:60px 20px;text-align:center;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.warn{background:#FFF8EF;border:1.5px dashed #E8B072;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#7A5A33}
</style></head><body>
<div class="wrap" id="app" style="display:none">
  <a class="back" href="full-hub-gated-site.html">‹ Hub</a>
  <h1>🗓 <span data-t="title"></span></h1>
  <div class="sub" data-t="sub"></div>

  <div class="kpis" id="kpis"></div>
  <div class="ms" id="milestones"></div>

  <h2>1 · <span data-t="h1"></span></h2>
  <div class="card">
    <div class="hint" data-t="chartHint"></div>
    <div id="chart"></div>
    <div id="chartLegend"></div>
  </div>

  <h2>2 · <span data-t="h2"></span></h2>
  <div class="card">
    <div class="hint" data-t="tableHint"></div>
    <table id="pp"><thead><tr>
      <th data-t="cWeek"></th><th class="num" data-t="cTesters"></th><th class="num" data-t="cActive"></th>
      <th class="num" data-t="cRealT"></th><th class="num" data-t="cRealA"></th><th></th>
    </tr></thead><tbody></tbody></table>
    <div class="hint" data-t="scaleHint"></div>
  </div>
</div>
<div id="gate" data-t="gate"></div>
<script src="/hub/pilot-charts.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const U='https://nebkqncvapelrarruyqb.supabase.co',K='sb_publishable_GYj7DKlcWZ2cxdwv-GkyHQ_WBbQWHau';
const sb=createClient(U,K);const $=i=>document.getElementById(i);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ES=(navigator.language||'en').toLowerCase().indexOf('es')===0;
const T=ES?{
  title:'Pilot Planning', gate:'Inicia sesión de founder (Access + admin con MFA) y recarga.',
  sub:'El plan del piloto semana a semana: cuántas testers queremos dentro y cuántas activas, con los hitos que no se pueden mover. Aquí se edita el objetivo; en Pilot Observability se mira el resultado.',
  h1:'Objetivo vs real · 13 semanas', h2:'Plan semanal (editable)',
  chartHint:'Línea discontinua = objetivo de testers dentro. Sólidas = instaladas reales por plataforma, solo hasta la semana en curso.',
  tableHint:'Edita cualquier celda y pulsa Guardar. La escala de las gráficas la marca el objetivo más alto de la tabla.',
  scaleHint:'La semana en curso va resaltada. Las columnas "real" solo se rellenan en semanas pasadas.',
  cWeek:'Semana (lunes)', cTesters:'Testers dentro (obj.)', cActive:'Activas (obj.)',
  cRealT:'Real dentro', cRealA:'Real activas',
  kTarget:'Población objetivo', kTargetS:'testers al lanzamiento',
  kNow:'Dentro hoy', kGap:'Desvío vs plan', kGapS:'de la semana en curso',
  kWeeks:'Semanas al lanzamiento', kWeeksS:'hasta el 8-oct',
  plan:'objetivo', save:'Guardar', saved:'✓',
  ms:'<b>Hitos que no se mueven</b> · <b>17-ago</b>: 12 testers Android instaladas y activas 14 días seguidos (requisito de Google Play para pasar a producción). · <b>8-oct</b>: lanzamiento.',
  noSql:'⚠️ Falta aplicar backend-sql/2026-08-04-pilot-weekly.sql en Supabase (RPC admin_pilot_weekly).',
  noRows:'Sin semanas de plan todavía.'
}:{
  title:'Pilot Planning', gate:'Sign in as a founder (Access + admin with MFA) and reload.',
  sub:'The pilot plan week by week: how many testers we want in and how many active, with the milestones that cannot move. Targets are edited here; results live in Pilot Observability.',
  h1:'Target vs actual · 13 weeks', h2:'Weekly plan (editable)',
  chartHint:'Dashed line = target testers in. Solid = real installs by platform, only up to the current week.',
  tableHint:'Edit any cell and hit Save. The highest target in this table sets the charts’ scale.',
  scaleHint:'The current week is highlighted. "Actual" columns only fill in for past weeks.',
  cWeek:'Week (Monday)', cTesters:'Testers in (target)', cActive:'Active (target)',
  cRealT:'Actual in', cRealA:'Actual active',
  kTarget:'Target population', kTargetS:'testers at launch',
  kNow:'In today', kGap:'Gap vs plan', kGapS:'for the current week',
  kWeeks:'Weeks to launch', kWeeksS:'until 8 Oct',
  plan:'target', save:'Save', saved:'✓',
  ms:'<b>Milestones that cannot move</b> · <b>17 Aug</b>: 12 Android testers installed and active for 14 consecutive days (Google Play requirement to reach production). · <b>8 Oct</b>: launch.',
  noSql:'⚠️ backend-sql/2026-08-04-pilot-weekly.sql not applied yet in Supabase (RPC admin_pilot_weekly).',
  noRows:'No plan weeks yet.'
};
document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=T[el.dataset.t]||'';});
document.title=T.title+' — NutriSync Founders';

const P=window.NSPilot;
let WEEKS=[],SCALE=58;

function render(){
  const cur=WEEKS.filter(w=>w.is_past).pop()||{};
  const gap=(+cur.installed||0)-(+cur.testers_plan||0);
  const launch=WEEKS.findIndex(w=>w.week>='2026-10-05');
  const now=WEEKS.filter(w=>w.is_past).length-1;
  $('kpis').innerHTML=
    P.kpi(T.kTarget,SCALE,T.kTargetS)+
    P.kpi(T.kNow,(+cur.installed||0),'iOS '+(+cur.ios||0)+' · Android '+(+cur.android||0))+
    P.kpi(T.kGap,(gap>=0?'+':'')+gap,T.kGapS)+
    P.kpi(T.kWeeks,(launch>=0?Math.max(0,launch-now):'—'),T.kWeeksS);
  $('milestones').innerHTML=T.ms;
  $('chart').innerHTML=WEEKS.length?P.platformChart(WEEKS,SCALE):'<div class="warn">'+T.noRows+'</div>';
  $('chartLegend').innerHTML=WEEKS.length?P.legend([[T.plan,P.C.plan,1],['iOS',P.C.coral],['Android',P.C.good]]):'';
  const tb=document.querySelector('#pp tbody');
  tb.innerHTML=WEEKS.map((w,i)=>{
    const inp=(k,v)=>'<input data-w="'+w.week+'" data-k="'+k+'" value="'+v+'" style="width:80px;text-align:right">';
    return '<tr class="'+(i===now?'now':'')+'"><td><b>'+esc(w.label)+'</b> <span class="hint">'+esc(w.week)+'</span></td>'+
      '<td class="num">'+inp('testers',w.testers_plan)+'</td>'+
      '<td class="num">'+inp('active',w.active_plan)+'</td>'+
      '<td class="num">'+(w.is_past?w.installed:'—')+'</td>'+
      '<td class="num">'+(w.is_past?w.active:'—')+'</td>'+
      '<td><button class="mini" data-save="'+w.week+'">'+T.save+'</button></td></tr>';
  }).join('')||'<tr><td colspan="6" class="hint">'+T.noRows+'</td></tr>';
  tb.querySelectorAll('button[data-save]').forEach(b=>{
    b.onclick=async()=>{
      const w=b.getAttribute('data-save');
      const g=k=>Number(tb.querySelector('input[data-w="'+w+'"][data-k="'+k+'"]').value||0);
      b.disabled=true;b.textContent='…';
      const{error}=await sb.rpc('admin_pilot_plan_set',{p_week:w,p_testers:g('testers'),p_active:g('active'),p_note:null});
      b.disabled=false;b.textContent=error?'Error':T.saved;
      if(!error)setTimeout(load,600);
    };
  });
}
async function load(){
  const{data,error}=await sb.rpc('admin_pilot_weekly');
  if(error){$('chart').innerHTML='<div class="warn">'+T.noSql+'<br>'+esc(error.message)+'</div>';return;}
  WEEKS=(data||{}).weeks||[];SCALE=+(data||{}).scale||58;
  render();
}
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(!session){$('gate').style.display='block';return;}
  $('app').style.display='block';
  await load();
})();
</script>
</body></html>
