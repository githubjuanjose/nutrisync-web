<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilot Observability — NutriSync Founders</title>
<style>
:root{--coral:#E8472A;--ink:#231F20;--muted:#8A7F78;--line:#EFE3D7;--bg:#FFFDF8;--good:#0F9B57;--bad:#C73A20;}
*{box-sizing:border-box}body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
.wrap{max-width:1150px;margin:0 auto;padding:26px 20px 80px;}
h1{font-size:24px;margin:0 0 2px}h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:800;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.msg{max-width:520px;white-space:pre-wrap}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:12px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar i{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#FF7600,#E8472A);display:block}
.fn{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fn div{flex:1;min-width:92px;background:#F8F3EC;border-radius:10px;padding:8px 10px}
.fn b{display:block;font-size:18px}
.fn span{font-size:10.5px;color:var(--muted)}
#gate{display:none;padding:60px 20px;text-align:center;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.warn{background:#FFF8EF;border:1.5px dashed #E8B072;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#7A5A33}
</style></head><body>
<div class="wrap" id="app" style="display:none">
  <a class="back" href="full-hub-gated-site.html">‹ Hub</a>
  <h1>📡 <span data-t="title"></span></h1>
  <div class="sub" data-t="sub"></div>

  <div id="health"></div>

  <div class="kpis" id="kpis"></div>
  <div class="card" style="margin-top:12px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:12.5px" data-t="cohLbl"></b><select id="coh" style="font-family:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:10px"></select></div><div id="cohCards" style="margin-top:10px"></div></div>

  <h2>1 · <span data-t="h1"></span></h2>
  <div class="card">
    <div class="hint" data-t="statesHint"></div>
    <div id="states"></div><div id="statesLegend"></div>
  </div>

  <h2>2 · <span data-t="h2"></span></h2>
  <div class="card">
    <div class="hint" data-t="activeHint"></div>
    <div id="active"></div><div id="activeLegend"></div>
    <div class="bars" id="daily"></div>
    <div class="hint" data-t="dailyHint"></div>
  </div>

  <h2>3 · <span data-t="h3"></span></h2>
  <div class="card" id="funnel"></div>

  <h2>4 · <span data-t="h4"></span></h2>
  <div class="card">
    <div class="hint" data-t="fbHint"></div>
    <table id="fb"><thead><tr>
      <th data-t="cWhen"></th><th data-t="cCohort"></th><th data-t="cWho"></th><th data-t="cMsg"></th><th data-t="cVer"></th><th data-t="cTicket"></th>
    </tr></thead><tbody></tbody></table>
  </div>
</div>
<div id="gate" data-t="gate"></div>
<script src="/hub/pilot-charts.js?v=04d52021"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const U='https://nebkqncvapelrarruyqb.supabase.co',K='sb_publishable_GYj7DKlcWZ2cxdwv-GkyHQ_WBbQWHau';
const sb=createClient(U,K);const $=i=>document.getElementById(i);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function nsL(){var v=null;try{v=localStorage.getItem('ns_lang');}catch(e){}
  return v||(((navigator.language||'en').toLowerCase().indexOf('es')===0)?'es':'en');}
const ES=nsL()==='es';
document.addEventListener('ns-lang',()=>location.reload());
const T=ES?{
  title:'Pilot Observability', gate:'Inicia sesión de founder (Access + admin con MFA) y recarga.',
  sub:'Cómo va el piloto de verdad: distribución del build, uso diario y lo que nos cuentan. El objetivo se fija en Pilot Planning; aquí solo se observa.',
  cohAll:'Todos los grupos', cohLbl:'Grupo de test', byCoh:'Por grupo de test',
  autoOk:'Automatismos al día', autoBad:'⚠️ Un automatismo ha fallado',
  autoSub:'Se comprueba solo cada vez que abres esta página · nada que ejecutar a mano',
  jNever:'sin ejecutar todavía', jStale:'sin correr en más de 26 h', jFail:'último intento fallido',
  snapLbl:'Última foto de TestFlight',
  h1:'Estado de distribución del build', h2:'Uso real', h3:'Embudo por cohorte', h4:'Feedback reciente', cTicket:'Ticket',
  statesHint:'Invitada (le mandamos el correo) → build asignado (está en TestFlight o en el track interno de Play) → instalada (ya tiene cuenta). "Sin responder" son las invitadas que aún no nos han dado su correo de tienda.',
  activeHint:'Activas por semana frente al objetivo. Una tester que instala y no vuelve no cuenta como piloto.',
  dailyHint:'Últimos 7 días de actividad (todas las usuarias, no solo el piloto).',
  fbHint:'Lo que escriben desde la app. Es la señal más valiosa que tenemos antes del 8-oct.',
  kInv:'Invitadas', kInvS:'correo del piloto enviado',
  kAsg:'Build asignado', kAsgS:'en TestFlight / Play',
  kIns:'Instaladas', kPend:'Sin responder', kPendS:'invitada, sin correo de tienda',
  kAct:'Activas 7 días', kActS:'del total instalado',
  lInv:'invitadas', lAsg:'build asignado', lIns:'instaladas', lPend:'sin responder',
  lPlan:'objetivo', lAct:'activas',
  cWhen:'Cuándo', cCohort:'Cohorte', cWho:'Quién', cMsg:'Mensaje', cVer:'Versión',
  noSql:'⚠️ Falta aplicar backend-sql/2026-08-04-pilot-weekly.sql en Supabase (RPC admin_pilot_weekly).',
  noRows:'Sin datos todavía.', noFb:'Sin mensajes aún — cuando una tester escriba desde la app aparecerá aquí.'
}:{
  title:'Pilot Observability', gate:'Sign in as a founder (Access + admin with MFA) and reload.',
  sub:'How the pilot is actually going: build distribution, real usage and what testers tell us. Targets are set in Pilot Planning; this page only observes.',
  cohAll:'All test groups', cohLbl:'Test group', byCoh:'By test group',
  autoOk:'Automations healthy', autoBad:'⚠️ An automation failed',
  autoSub:'Checked automatically every time you open this page · nothing to run by hand',
  jNever:'never run yet', jStale:'no run in over 26 h', jFail:'last attempt failed',
  snapLbl:'Latest TestFlight snapshot',
  h1:'Build distribution status', h2:'Real usage', h3:'Funnel by cohort', h4:'Recent feedback', cTicket:'Ticket',
  statesHint:'Invited (we emailed her) → build assigned (she is in TestFlight or the Play internal track) → installed (account created). "Not assigned" are invited testers who have not given us their store email yet.',
  activeHint:'Weekly actives against target. A tester who installs and never returns is not a pilot.',
  dailyHint:'Last 7 days of activity (all users, not just the pilot).',
  fbHint:'What they write from inside the app. It is the most valuable signal we have before 8 Oct.',
  kInv:'Invited', kInvS:'pilot email sent',
  kAsg:'Build assigned', kAsgS:'in TestFlight / Play',
  kIns:'Installed', kPend:'Not assigned', kPendS:'invited, no store email',
  kAct:'Active in 7 days', kActS:'of everyone installed',
  lInv:'invited', lAsg:'build assigned', lIns:'installed', lPend:'not assigned',
  lPlan:'target', lAct:'active',
  cWhen:'When', cCohort:'Cohort', cWho:'Who', cMsg:'Message', cVer:'Version',
  noSql:'⚠️ backend-sql/2026-08-04-pilot-weekly.sql not applied yet in Supabase (RPC admin_pilot_weekly).',
  noRows:'No data yet.', noFb:'No messages yet — once a tester writes from the app it shows up here.'
};
document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=T[el.dataset.t]||'';});
document.title=T.title+' — NutriSync Founders';


/* r12-b9 (fallo de hoy): si una RPC no existe, la pagina se quedaba en blanco y
   parecia que "no hay datos". Ahora GRITA, y dice el fichero que falta correr. */
function nsFail(err,fn){
  var d=document.getElementById('nsfail');
  if(!d){d=document.createElement('div');d.id='nsfail';
    d.style.cssText='background:#FFF1EC;border:2px solid #E8472A;border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:13px;color:#8A2A18';
    var w=document.querySelector('.wrap');w.insertBefore(d,w.children[2]||null);}
  d.innerHTML='<b>⚠️ Falta aplicar SQL en Supabase</b><div style="margin-top:6px">La consulta <code>'+fn+
    '</code> no responde: <i>'+String((err&&err.message)||err).slice(0,160)+'</i></div>'+
    '<div style="margin-top:6px">Ejecuta <b>backend-sql/2026-08-04-EJECUTAR-TODO-PENDIENTE.sql</b> entero y recarga.</div>';
}

/* r12-b11: si pilot-charts.js no llegó a cargar, TODO lo que viene despues
   moria en silencio (incluido el embudo). Ahora se dice y se sigue. */
if(!window.NSPilot){
  nsFail(new Error('pilot-charts.js no se ha cargado en el navegador'),'hub/pilot-charts.js');
}
const NOOP={kpi:function(){return'';},legend:function(){return'';},cohortCards:function(){return'';},
  platformChart:function(){return'';},statesChart:function(){return'';},activeChart:function(){return'';},
  lineChart:function(){return'';},lastPast:function(){return -1;},linePath:function(){return'';},C:{}};
const P=Object.assign({},NOOP,window.NSPilot||{});
if(window.NSPilot&&typeof window.NSPilot.cohortCards!=='function'){
  nsFail(new Error('pilot-charts.js cacheado y desactualizado — recarga forzada'),'hub/pilot-charts.js');
}

/* r12-b8: la salud de los crons se mira SOLA al abrir la pagina. Verde y
   discreta cuando todo va; roja y grande cuando algo falla — que es cuando
   hay que enterarse. */
async function loadHealth(){
  const{data,error}=await sb.rpc('admin_automation_health');
  if(error){nsFail(error,'admin_automation_health');return;}
  if(!data)return;
  const jobs=data.jobs||[],snap=data.snapshot;
  const bad=jobs.filter(j=>!j.active||!j.ok||!j.fresh);
  const why=j=>!j.start_time?T.jNever:(!j.ok?T.jFail:(!j.fresh?T.jStale:''));
  const when=t=>t?new Date(t).toLocaleString(ES?'es-ES':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
  const rows=jobs.map(j=>'<div style="display:flex;gap:8px;align-items:baseline;font-size:12.5px;margin-top:3px">'+
    '<span>'+((j.active&&j.ok&&j.fresh)?'🟢':'🔴')+'</span><b>'+esc(j.jobname)+'</b>'+
    '<span class="hint">'+esc(j.schedule)+' · '+when(j.start_time)+(why(j)?' · '+why(j):'')+'</span></div>').join('');
  const snapTxt=snap?('<div class="hint" style="margin-top:8px">'+T.snapLbl+': '+when(snap.taken_at)+' · '+
    (snap.total||0)+' testers · '+esc(JSON.stringify(snap.tally||{}))+'</div>'):'';
  $('health').innerHTML='<div class="card" style="margin-top:0;border-color:'+(bad.length?'#E8B072':'var(--line)')+
    ';background:'+(bad.length?'#FFF8EF':'#fff')+'">'+
    '<b style="font-size:13px;color:'+(bad.length?'#C73A20':'var(--good)')+'">'+(bad.length?T.autoBad:'🟢 '+T.autoOk)+'</b>'+
    '<div class="hint">'+T.autoSub+'</div>'+rows+snapTxt+'</div>';
}

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(!session){$('gate').style.display='block';return;}
  $('app').style.display='block';

  async function loadWeekly(){
    const c=$('coh').value||null;
    const pw=await sb.rpc('admin_pilot_weekly',{p_cohort:c});
    if(pw.error){nsFail(pw.error,'admin_pilot_weekly');$('states').innerHTML='<div class="warn">'+T.noSql+'</div>';return;}
    const W=(pw.data||{}).weeks||[],S=+(pw.data||{}).scale||58,COH=(pw.data||{}).cohorts||[];
    if($('coh').options.length<=1){
      $('coh').innerHTML='<option value="">'+T.cohAll+'</option>'+COH.map(x=>'<option value="'+esc(x.cohort)+'">'+esc(x.cohort)+' ('+x.total+')</option>').join('');
      $('coh').onchange=loadWeekly;
    }
    $('cohCards').innerHTML=P.cohortCards(COH,{lInv:T.lInv,lAsg:T.lAsg,lIns:T.lIns,lAct:T.lAct});
    const cur=W.filter(w=>w.is_past).pop()||{};
    $('kpis').innerHTML=
      P.kpi(T.kInv,(+cur.invited||0),T.kInvS)+
      P.kpi(T.kAsg,(+cur.assigned||0),T.kAsgS)+
      P.kpi(T.kIns,(+cur.installed||0),'iOS '+(+cur.ios||0)+' · Android '+(+cur.android||0))+
      P.kpi(T.kPend,(+cur.pending||0),T.kPendS)+
      P.kpi(T.kAct,(+cur.active||0),(+cur.installed?Math.round((+cur.active||0)/(+cur.installed)*100)+'% ':'')+T.kActS);
    $('states').innerHTML=W.length?P.statesChart(W,S):'<div class="warn">'+T.noRows+'</div>';
    $('statesLegend').innerHTML=W.length?P.legend([[T.lInv,P.C.muted],[T.lAsg,P.C.coral2],[T.lIns,P.C.coral],[T.lPend,P.C.plan,1]]):'';
    $('active').innerHTML=W.length?P.activeChart(W,S):'';
    $('activeLegend').innerHTML=W.length?P.legend([[T.lPlan,P.C.plan,1],[T.lAct,P.C.coral]]):'';
  }
  $('coh').innerHTML='<option value="">'+T.cohAll+'</option>';
  await loadWeekly();
  await loadHealth();

  const [fn,kp]=await Promise.all([sb.rpc('admin_pilot_funnel'),sb.rpc('admin_kpis')]);
  const daily=((kp.data||{}).daily_active)||[];
  const maxD=Math.max.apply(null,daily.concat([1]));
  $('daily').innerHTML=daily.length?daily.map(v=>
    '<div class="bar"><span class="hint">'+v+'</span><i style="height:'+Math.max(2,(v/maxD)*88)+'px"></i></div>').join(''):
    '<div class="hint">'+T.noRows+'</div>';

  const by=((fn.data||{}).by_cohort)||[];
  $('funnel').innerHTML=by.length?by.map(c=>
    '<div style="margin-bottom:12px"><b>'+esc(c.cohort)+'</b><div class="fn">'+
    [[c.total,T.lInv],[c.confirmed,T.lAsg],[c.joined,T.lIns],[c.active7,T.lAct],[c.pending_install,T.kPend]]
      .map(x=>'<div><b>'+(x[0]??0)+'</b><span>'+x[1]+'</span></div>').join('')+
    '</div></div>').join(''):'<div class="hint">'+T.noRows+'</div>';

  /* r14 (punto 10): el estado del ticket se ve aquí mismo — abierto/edad/resuelto/📣 */
  const tk=r=>{
    if(!r.ticket_no)return '<span class="hint">—</span>';
    const ST={nuevo:'#A32D2D',en_curso:'#B4700F',esperando_usuaria:'#1D4ED8',resuelto:'#0F6E56',cerrado:'#475569'};
    const col=ST[r.ticket_status]||'#475569';
    let edad='';
    if(r.resolved_at){const h=(new Date(r.resolved_at)-new Date(r.ticket_created))/36e5;
      edad=' · ✔ '+(h<48?Math.round(h)+' h':Math.round(h/24)+' d');}
    else if(r.ticket_status!=='cerrado'){const h=(Date.now()-new Date(r.ticket_created))/36e5;
      edad=' · ⏱ '+(h<48?Math.round(h)+' h':Math.round(h/24)+' d')+(h>=24?' ⚠':'');}
    return '<span style="font-weight:800;color:#C73A20">'+esc(r.ticket_no)+'</span>'
      +' <span style="font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 8px;background:'+col+'1a;color:'+col+'">'
      +esc((r.ticket_status||'').replace(/_/g,' '))+'</span>'
      +'<span class="hint">'+edad+(r.escalated_at?' · 📣':'')+'</span>';
  };
  const fb=await sb.rpc('admin_pilot_feedback',{p_cohort:null});
  $('fb').tBodies[0].innerHTML=((fb.data||[]).map(r=>
    '<tr><td>'+esc((r.created_at||'').slice(0,16).replace('T',' '))+'</td><td>'+esc(r.cohort||'')+'</td><td>'+esc(r.email||'')+'</td>'+
    '<td class="msg">'+esc(r.message||'')+'</td><td>'+esc(r.app_version||'?')+' · '+esc(r.platform||'?')+'</td>'+'<td>'+tk(r)+'</td></tr>').join(''))
    ||'<tr><td colspan="5" class="hint">'+T.noFb+'</td></tr>';
})();
</script>
</body></html>
