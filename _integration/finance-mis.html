<!-- ns-finance-mis --><div class="section" style="padding:26px 0 0;"><div style="max-width:1080px;margin:0 auto;padding:0 22px;"><h2 class="title" style="font-size:22px;margin:0 0 4px;">Finanzas</h2><div style="color:var(--muted);font-size:13px;margin-bottom:14px;">Caja y resultado del libro diario (admin_finance_summary) &middot; detalle y asientos en <a href="finance.html" style="color:var(--coral-deep);font-weight:700">hub &rarr; 💶 Finanzas</a></div><div id="fmWrap" style="display:flex;gap:14px;flex-wrap:wrap;"><div style="color:var(--muted);font-size:13px;">Cargando&hellip;</div></div></div></div><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const U='https://nebkqncvapelrarruyqb.supabase.co',K='sb_publishable_GYj7DKlcWZ2cxdwv-GkyHQ_WBbQWHau';
const sb=createClient(U,K);const box=document.getElementById('fmWrap');
const eur=n=>Number(n??0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const card=(l,v,neg)=>`<div style="flex:1;min-width:170px;background:#fff;border:1px solid #EADFD5;border-radius:14px;padding:14px 16px"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">${l}</div><div style="font-size:22px;font-weight:800;margin-top:3px;color:${neg?'#C73A20':'#241D1A'}">${v}</div></div>`;
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(!session){box.innerHTML='<div style="color:var(--muted);font-size:13px">Inicia sesi&oacute;n de admin arriba para ver finanzas.</div>';return;}
  const{data,error}=await sb.rpc('admin_finance_summary');
  const bl=await sb.rpc('admin_build_ledger',{p_limit:1});   // r14c (2.3): el build también cuenta
  const BG=(bl.data&&Number(bl.data.total_gasto_eur))||0, BR=(bl.data&&Number(bl.data.en_revision_eur))||0;
  if(error){box.innerHTML='<div style="color:var(--muted);font-size:13px">Sin acceso ('+String(error.message).replace(/[<>]/g,'')+') &mdash; &iquest;SQL finance aplicado?</div>';return;}
  const m=data.month||{},y=data.ytd||{};const rm=(m.in||0)-(m.out||0),ry=(y.in||0)-(y.out||0);
  box.innerHTML=card('Caja',eur(data.cash),data.cash<0)+card('Ingresos mes',eur(m.in),false)+card('Gastos mes (caja)',eur(m.out),false)+card('Gasto build YTD',eur(BG),BG>0)+card('En revisión IAS 38',eur(BR),false)+card('Resultado YTD (caja+build)',eur(ry-BG),(ry-BG)<0);
})();
</script>
