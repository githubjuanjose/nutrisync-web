<!-- ns-kpi-live --><script type="module">
/* r11d → po56 · KPIs honestos: actual (live) vs plan (modelo realista ago-2026).
   po56: selección por ETIQUETA (.lab) en vez de id kTotal — el mismo snippet
   sirve en admin-mis-console.html Y en el MIS del gated site de Builders
   (que seguía enseñando "Illustrative sample data"). Pre-lanzamiento:
   Premium/MRR/Churn muestran PLAN, jamás números de muestra. */
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const U='https://nebkqncvapelrarruyqb.supabase.co',K='sb_publishable_GYj7DKlcWZ2cxdwv-GkyHQ_WBbQWHau';
const sb=createClient(U,K);
const PLAN={users_y1:2634, revenue_y1:74772, conv:0.065};   // modelo realista ago-2026 (misma fuente que admin_business_case)

const kpis=[...document.querySelectorAll('.kpi')];
const by=re=>kpis.find(k=>re.test((k.querySelector('.lab')||{textContent:''}).textContent));
function setCard(k,val,sub,subColor){
  if(!k)return;
  const v=k.querySelector('.val'); if(v)v.textContent=val;
  const d=k.querySelector('.delta'); if(d){d.textContent=sub; d.style.color=subColor||'var(--muted)'; d.classList.remove('up','down');}
}

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  // cabecera + fecha SIEMPRE sinceras (con o sin sesión)
  document.querySelectorAll('*').forEach(n=>{
    if(n.children.length===0&&/Illustrative sample data/.test(n.textContent))
      n.textContent=session?'LIVE · actuals vs plan (Realistic Y1: 2,634 users · €74,772)':'MUESTRA — inicia sesión de admin para ver datos reales';
    if(n.children.length===0&&/^As of /.test(n.textContent.trim()))
      n.textContent='As of '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  });
  const kU=by(/total users/i), kP=by(/premium/i), kM=by(/mrr/i), kC=by(/churn/i);
  if(!session){
    // sin sesión admin: nada de atrezzo — vaciar a "—" con nota
    [kU,kP,kM,kC].forEach(k=>setCard(k,'—','requiere sesión de admin'));
    return;
  }
  const[k,g]=await Promise.all([sb.rpc('admin_kpis'),sb.rpc('admin_growth')]);
  if(k.error){[kU,kP,kM,kC].forEach(x=>setCard(x,'—','sin datos (admin_kpis)'));return;}
  const kd=k.data, months=(g.data&&g.data.months)||[];
  // ── Users: actual + MoM real + plan ──
  const last=months[months.length-1], prev=months[months.length-2];
  const mom=(last&&prev&&prev.users)?Math.round(((last.users-prev.users)/prev.users)*100):null;
  setCard(kU, Number(kd.total_users).toLocaleString('en-US'),
    (mom!=null?`▲ ${mom}% MoM real · `:'')+`plan Y1 ${PLAN.users_y1}`, mom!=null&&mom>=0?'var(--good)':'var(--muted)');
  // ── Premium / MRR / Churn: pre-lanzamiento → plan, no atrezzo ──
  setCard(kP,'—',`pre-lanzamiento · plan ${Math.round(PLAN.conv*100)}% conv (8 oct)`);
  setCard(kM,'€0',`pre-lanzamiento · plan Y1 €${PLAN.revenue_y1.toLocaleString('en-US')}`);
  setCard(kC,'—','pre-lanzamiento · se mide desde el piloto F1');
})();
</script>
