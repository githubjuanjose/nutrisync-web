<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback — NutriSync Founders</title>
<style>
:root{--coral:#E8472A;--ink:#231F20;--muted:#8A7F78;--line:#EFE3D7;--bg:#FFFDF8;}
*{box-sizing:border-box}body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
.wrap{max-width:1000px;margin:0 auto;padding:26px 20px 80px;}
h1{font-size:24px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font-family:inherit;font-weight:700;font-size:13px;border-radius:22px;padding:8px 16px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
select,input[type=text]{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.fb{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:10px}
.fb .meta{font-size:11.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb .msg{font-size:14px;line-height:1.5;white-space:pre-wrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:10.5px;font-weight:700;background:#F6EEE7;color:#8A7F78}
.pill.c{background:#FDEEE6;color:#C05621}
#gate{display:none;padding:60px 20px;text-align:center;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.count{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="wrap" id="app" style="display:none">
  <a class="back" href="full-hub-gated-site.html">‹ Back</a>
  <h1>💬 App Feedback</h1>
  <div class="sub">Mensajes de Settings → Send Feedback, etiquetados por cohorte del piloto. Copia de cada mensaje llega también a feedback@nutrisynccollective.com.</div>
  <div class="card">
    <div class="row">
      <select id="fCohort"><option value="">todas las cohortes</option></select>
      <select id="fPlat"><option value="">plataforma: todas</option><option>ios</option><option>android</option><option>web</option></select>
      <input type="text" id="q" placeholder="buscar en los mensajes…" style="flex:1;min-width:180px">
      <button onclick="load()">Actualizar</button>
      <button onclick="exportCsv()" title="Exporta lo que ves con los filtros actuales">⬇ CSV</button>
      <span class="count" id="count"></span>
    </div>
  </div>
  <div id="list"><div class="hint">Cargando…</div></div>
</div>
<div id="gate">Inicia sesión de founder (Access + admin) y recarga — esta página es solo para admins.</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const U='https://nebkqncvapelrarruyqb.supabase.co',K='sb_publishable_GYj7DKlcWZ2cxdwv-GkyHQ_WBbQWHau';
const sb=createClient(U,K);const $=i=>document.getElementById(i);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ALL=[];
/* r14b (punto 8): el estado del ticket, visible en cada mensaje */
const STC={nuevo:'#A32D2D',en_curso:'#B4700F',esperando_usuaria:'#1D4ED8',resuelto:'#0F6E56',cerrado:'#475569'};
const tk=r=>{if(!r.ticket_no)return '';
  const col=STC[r.ticket_status]||'#475569';let edad='';
  if(r.resolved_at){const h=(new Date(r.resolved_at)-new Date(r.ticket_created))/36e5;edad=' ✔ '+(h<48?Math.round(h)+'h':Math.round(h/24)+'d');}
  else if(r.ticket_status!=='cerrado'&&r.ticket_created){const h=(Date.now()-new Date(r.ticket_created))/36e5;edad=' ⏱ '+(h<48?Math.round(h)+'h':Math.round(h/24)+'d')+(h>=24?'⚠':'');}
  return ` <b style="color:#C73A20;font-size:11px">${esc(r.ticket_no)}</b> <span style="font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px;background:${col}1a;color:${col}">${esc((r.ticket_status||'').replace(/_/g,' '))}</span><span style="font-size:10px;color:#8A7F78">${edad}${r.escalated_at?' 📣':''}</span>`;};
function render(){
  const c=$('fCohort').value,p=$('fPlat').value,q=$('q').value.toLowerCase();
  const rows=ALL.filter(r=>(!c||(r.cohort||'—')===c)&&(!p||(r.platform||'').toLowerCase().startsWith(p))&&(!q||(r.message||'').toLowerCase().includes(q)||(r.email||'').toLowerCase().includes(q)));
  $('count').textContent=rows.length+' de '+ALL.length;
  $('list').innerHTML=rows.map(r=>`<div class="fb">
    <div class="meta"><b>${esc(r.email)}</b><span class="pill c">${esc(r.cohort||'—')}</span>${tk(r)}
    <span>${esc((r.created_at||'').slice(0,16).replace('T',' '))}</span>
    <span class="pill">v${esc(r.app_version||'?')} · ${esc(r.platform||'?')}</span></div>
    <div class="msg">${esc(r.message)}</div>
    ${r.ticket_id?`<div style="margin-top:8px"><button class="mini" onclick="window.fbTog('${esc(r.ticket_id)}')">✏️ Gestionar / Manage</button></div>
    <div id="fb-${esc(r.ticket_id)}" style="display:none;border-top:1px dashed #EADFD0;margin-top:8px;padding-top:8px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select id="st-${esc(r.ticket_id)}">${['nuevo','en_curso','esperando_usuaria','resuelto','cerrado'].map(x=>`<option value="${x}"${x===r.ticket_status?' selected':''}>${x.replace(/_/g,' ')}</option>`).join('')}</select>
        <input id="ac-${esc(r.ticket_id)}" type="text" placeholder="acción interna / internal action" style="flex:1;min-width:180px">
        <button class="mini" onclick="window.fbSave('${esc(r.ticket_id)}')">💾 Guardar seguimiento</button>
      </div>
      <textarea id="re-${esc(r.ticket_id)}" placeholder="Respuesta a la usuaria (le llega a su app con el ${esc(r.ticket_no||'ticket')}) / reply lands in her app" style="width:100%;box-sizing:border-box;min-height:56px;margin-top:8px">${esc(r.respuesta||'')}</textarea>
      <div style="display:flex;gap:8px;margin-top:6px;align-items:center">
        <button class="mini" onclick="window.fbResp('${esc(r.ticket_id)}',false)">Guardar respuesta</button>
        <button class="mini" style="background:linear-gradient(135deg,#FF7600,#FD400C);color:#fff;border:none" onclick="window.fbResp('${esc(r.ticket_id)}',true)">📨 Guardar y enviar a la usuaria</button>
        <span class="hint" id="ok-${esc(r.ticket_id)}"></span>
        <a class="hint" href="/hub/incidents.html" style="margin-left:auto">rastro completo → 🎫 Incidencias</a>
      </div>
    </div>`:''}</div>`).join('')||'<div class="hint">Sin mensajes con esos filtros.</div>';
}
/* r14c (punto 8): gestión ligera desde Feedback — mismo motor que Incidencias.
   Hoy feedback y ticket van 1:1; cuando se separen, este panel solo saldrá donde haya ticket. */
window.fbTog=id=>{const d=document.getElementById('fb-'+id);if(d)d.style.display=d.style.display==='none'?'block':'none';};
window.fbSave=async id=>{
  const ok=document.getElementById('ok-'+id);ok.textContent='guardando…';
  const r=await sb.rpc('admin_ticket_update',{p_id:id,p_status:document.getElementById('st-'+id).value,
    p_assigned:null,p_accion:document.getElementById('ac-'+id).value||null,p_comentario:'gestionado desde Feedback'});
  ok.textContent=(r.error||!(r.data&&r.data.ok))?('⚠ '+((r.error&&r.error.message)||'error')):'✓ guardado';
  if(!r.error)load();
};
window.fbResp=async(id,enviar)=>{
  const txt=document.getElementById('re-'+id).value.trim(),ok=document.getElementById('ok-'+id);
  if(!txt){ok.textContent='⚠ respuesta vacía';return;}
  if(enviar&&!confirm('La usuaria verá esta respuesta en su app. ¿Enviar? / Send to her app?'))return;
  ok.textContent=enviar?'enviando…':'guardando…';
  const r=await sb.rpc('admin_ticket_respond',{p_id:id,p_respuesta:txt,p_enviar:enviar});
  ok.textContent=(r.error||!(r.data&&r.data.ok))?('⚠ '+((r.error&&r.error.message)||'error')):(enviar?'📨 enviada':'✓ guardada');
};
const csvCell=v=>'"'+String(v??'').replace(/"/g,'""').replace(/\r?\n/g,' · ')+'"';
window.exportCsv=()=>{
  const c=$('fCohort').value,p=$('fPlat').value,q=$('q').value.toLowerCase();
  const rows=ALL.filter(r=>(!c||(r.cohort||'—')===c)&&(!p||(r.platform||'').toLowerCase().startsWith(p))&&(!q||(r.message||'').toLowerCase().includes(q)||(r.email||'').toLowerCase().includes(q)));
  if(!rows.length)return alert('Nada que exportar con esos filtros.');
  const CAB=['fecha','usuaria','cohorte','version','plataforma','mensaje'];
  const csv='\ufeff'+CAB.join(';')+'\n'+rows.map(r=>[r.created_at||'',r.email||'',r.cohort||'',
    r.app_version||'',r.platform||'',r.message||''].map(csvCell).join(';')).join('\n');
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='nutrisync-feedback-'+pad(d.getDate())+pad(d.getMonth()+1)+'-'+pad(d.getHours())+pad(d.getMinutes())+'.csv';
  a.click();URL.revokeObjectURL(a.href);
};
window.load=async()=>{
  const{data,error}=await sb.rpc('admin_pilot_feedback',{p_cohort:null});
  if(error){$('list').innerHTML='<div class="hint">Sin acceso: '+esc(error.message)+' — ¿sesión admin con MFA?</div>';return;}
  ALL=data||[];
  const cs=[...new Set(ALL.map(r=>r.cohort||'—'))].sort();  // r14: sin cohorte también es filtrable
  $('fCohort').innerHTML='<option value="">todas las cohortes</option>'+cs.map(c=>`<option>${esc(c)}</option>`).join('');
  render();
};
['fCohort','fPlat'].forEach(i=>$(i).addEventListener('change',render));
$('q').addEventListener('input',render);
(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(!session){$('gate').style.display='block';return;}
  $('app').style.display='block';load();
})();
</script></body></html>
